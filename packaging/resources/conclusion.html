<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font: 13px -apple-system, sans-serif; color: #1f2328; margin: 0; padding: 4px 8px; }
  @media (prefers-color-scheme: dark) { body { color: #e6edf3; } code { background: #22272e; } }
  h1 { font: 600 20px ui-monospace, Menlo, monospace; margin: 0 0 10px; }
  .accent { color: #12a35a; }
  code { font: 12px ui-monospace, Menlo, monospace; background: #eef1f4; padding: 1px 5px; border-radius: 4px; }
  ul { padding-left: 18px; line-height: 1.7; }
</style></head>
<body>
  <h1><span class="accent">&#10003;</span> DevTasks is installed</h1>
  <p>It's in your Applications folder and should already be open.</p>
  <ul>
    <li><b>Cmd N</b> add a task, <b>@</b> picks a list, <b>Shift Enter</b> new line</li>
    <li><b>Cmd 1-5</b> switch lists and notes</li>
    <li>Terminal: <code>devtasks help</code></li>
  </ul>
  <p>Updates: DevTasks &gt; Check for Updates.</p>
</body></html>
